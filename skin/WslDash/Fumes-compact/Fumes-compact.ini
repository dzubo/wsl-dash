[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
Group=WslDash
; A separate DragGroup from the classic stack: CTRL+ALT-click drags this
; panel on its own, never together with the three Fumes-<account> windows.
DragGroup=WslDashCompact
LeftMouseUpAction=[!CommandMeasure mData "Update"][!Redraw]

[Metadata]
Name=Fumes - compact
Author=Denis Zubo
Information=All fumes accounts in one compressed panel (one-line rows, merged accounts, squeezed constants). Colors: green under 80, amber to 95, red at 95 and up.
License=MIT
Version=0.3.1

[Variables]
; The accounts to merge, in stack order. The unrolled blocks in
; @Resources/CompactRows.inc are keyed on these, so adding a fourth account
; means generating a fourth block there, not just a line here.
A1=opencode
A2=claude
A3=claude-a

@Include=#@#Compact.inc
@Include2=#@#CompactRows.inc
