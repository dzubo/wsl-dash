; Fumes -- remaining AI provider limits, produced inside WSL by `fumes --json`
; and served by wsl-dash.  https://github.com/dzubo/wsl-dash
;
; Rainmeter's WebParser cannot parse JSON, so this reads wsl-dash's flat
; `key=value` endpoint. One measure downloads it; every other measure re-parses
; that same download via `Url=[mData]`, so there is one HTTP request per
; refresh no matter how many fields are on screen.
;
; Why every pattern is a lookbehind with no capture group: in this
; parent/child arrangement a child measure's StringIndex=1 returns the *whole
; match*, not the first group (StringIndex=2 returns nothing at all). Writing
; `(?<=\nkey=)[^\n]*` makes the whole match the value, which sidesteps the
; question. Verified against Rainmeter 4.5 on Windows 10.
;
; Rows are unrolled because Rainmeter has no loops. To show more than 8
; records, copy the last row block and bump every index in it.

[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=22,24,30,215
LeftMouseUpAction=[!CommandMeasure mData "Update"][!Redraw]

[Metadata]
Name=Fumes
Author=Denis Zubo
Information=AI provider limits from WSL, via wsl-dash.
License=MIT
Version=0.1.0

[Variables]
; wsl-dash's port and producer name. Windows reaches the WSL daemon through
; the localhost relay, which is why this is localhost and not the VM's IP.
Port=8781
Producer=fumes
; Seconds between fetches. Match or exceed the producer's own interval in
; wsl-dash.toml -- polling faster only re-reads the same cache.
RefreshSeconds=120
W=320
PAD=12
BarW=296
cText=222,225,232
cMuted=138,144,156
cGreen=126,200,120
cAmber=226,178,84
cRed=224,108,108
cBarBg=255,255,255,22
Offline=0

; --------------------------------------------------------------------------
; Measures
; --------------------------------------------------------------------------

; The one download. Every other measure re-parses this measure's data.
[mData]
Measure=WebParser
Url=http://localhost:#Port#/p/#Producer#.txt
RegExp=(?s)(.*)
StringIndex=1
UpdateRate=#RefreshSeconds#
; If the daemon is down or WSL is not running, the child measures keep their
; last values -- stale numbers that still look current. Flip a flag instead so
; the header can say so.
OnConnectErrorAction=[!SetVariable Offline 1][!UpdateMeasure mStatus][!UpdateMeter *][!Redraw]
OnDownloadErrorAction=[!SetVariable Offline 1][!UpdateMeasure mStatus][!UpdateMeter *][!Redraw]
FinishAction=[!SetVariable Offline 0][!UpdateMeasure *][!UpdateMeter *][!Redraw]

[mOk]
Measure=WebParser
Url=[mData]
RegExp=(?<=\nok=)[^\n]*
StringIndex=1
RegExpSubstitute=1
Substitute="^$":"0"

[mCount]
Measure=WebParser
Url=[mData]
RegExp=(?<=\ndata\.records\.count=)[^\n]*
StringIndex=1
RegExpSubstitute=1
Substitute="^$":"0"

[mAge]
Measure=WebParser
Url=[mData]
RegExp=(?<=\nage_seconds=)[^\n]*
StringIndex=1
RegExpSubstitute=1
Substitute="^$":"0"

; Header status: offline beats a producer error beats fine.
[mStatus]
Measure=Calc
Formula=(#Offline# = 1) ? 2 : (([mOk] = 0) ? 1 : 0)
DynamicVariables=1
IfCondition=(#CURRENTSECTION# = 2)
IfTrueAction=[!SetOption Status Text "WSL OFFLINE"][!SetOption Status FontColor #cRed#]
IfCondition2=(#CURRENTSECTION# = 1)
IfTrueAction2=[!SetOption Status Text "NO DATA"][!SetOption Status FontColor #cAmber#]
IfCondition3=(#CURRENTSECTION# = 0)
IfTrueAction3=[!SetOption Status Text ""][!SetOption Status FontColor #cMuted#]

; ---- row 0 ----
[mR0Acct]
Measure=WebParser
Url=[mData]
RegExp=(?<=\ndata\.records\.0\.account=)[^\n]*
StringIndex=1

[mR0Label]
Measure=WebParser
Url=[mData]
RegExp=(?<=\ndata\.records\.0\.label=)[^\n]*
StringIndex=1

; The substitution covers uncapped rows, where fumes reports a null percentage
; and the flat form emits an empty value. Without it the Calc below would be
; built from an empty string and error.
[mR0Pct]
Measure=WebParser
Url=[mData]
RegExp=(?<=\ndata\.records\.0\.pct=)[^\n]*
StringIndex=1
RegExpSubstitute=1
Substitute="^$":"0"

[mR0Reset]
Measure=WebParser
Url=[mData]
RegExp=(?<=\ndata\.records\.0\.resets_at_in=)[^\n]*
StringIndex=1

; Drives the bar and colours it by how close to the cap.
[mR0Calc]
Measure=Calc
Formula=[mR0Pct]
DynamicVariables=1
MinValue=0
MaxValue=100
IfCondition=(#CURRENTSECTION# >= 90)
IfTrueAction=[!SetOption R0Bar BarColor #cRed#][!SetOption R0Right FontColor #cRed#]
IfCondition2=(#CURRENTSECTION# >= 70) && (#CURRENTSECTION# < 90)
IfTrueAction2=[!SetOption R0Bar BarColor #cAmber#][!SetOption R0Right FontColor #cAmber#]
IfCondition3=(#CURRENTSECTION# < 70)
IfTrueAction3=[!SetOption R0Bar BarColor #cGreen#][!SetOption R0Right FontColor #cMuted#]

; Hides the whole row when the producer returned fewer than 1 records.
[mR0Vis]
Measure=Calc
Formula=[mCount]
DynamicVariables=1
IfCondition=(#CURRENTSECTION# > 0)
IfTrueAction=[!ShowMeterGroup R0]
IfFalseAction=[!HideMeterGroup R0]

