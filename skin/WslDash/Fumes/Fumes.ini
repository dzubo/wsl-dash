; --------------------------------------------------------------------------
; Meters
; --------------------------------------------------------------------------

; The panel itself. A Shape meter rather than the skin's SolidColor, because
; only Shape gives rounded corners and a hairline edge.
[Panel]
Meter=Shape
X=0
Y=0
Shape=Rectangle 0.5,0.5,343,413,10 | Fill Color #cPanel# | StrokeWidth 1 | Stroke Color #cEdge#

[Dot]
Meter=Image
X=#PAD#
Y=22
W=6
H=6
SolidColor=#cGreen#

[Title]
Meter=String
X=10R
Y=17
FontFace=#Face#
FontSize=10
FontWeight=600
FontColor=#cText#
StringCase=Upper
AntiAlias=1
Text=AI limits

[Status]
Meter=String
X=(#W# - #PAD#)
Y=19
StringAlign=Right
FontFace=#Face#
FontSize=8
FontWeight=600
FontColor=#cMuted#
AntiAlias=1
Text=

[Rule]
Meter=Image
X=#PAD#
Y=42
W=#BarW#
H=1
SolidColor=255,255,255,20

[Footer]
Meter=String
X=#PAD#
Y=392
FontFace=#Face#
FontSize=8
FontColor=#cFaint#
