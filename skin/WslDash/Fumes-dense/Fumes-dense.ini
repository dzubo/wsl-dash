[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
Group=WslDash
; Stay topmost: this panel is a glanceable dashboard, so ordinary windows
; (a focused browser, say) must not cover it. A per-config AlwaysOnTop in
; Rainmeter.ini overrides this value once one exists.
AlwaysOnTop=2
; CTRL+ALT-click drags this panel on its own; the DragGroup keeps it
; independent of any other skin's drag group.
DragGroup=WslDashDense
LeftMouseUpAction=[!CommandMeasure mData "Update"][!Redraw]

[Metadata]
Name=Fumes - dense
Author=Denis Zubo
Information=All fumes accounts in one dense card: hairline bars beneath one-line rows, hairline dividers between account sections, tier-coloured percentages, per-account error strips. Colors: green under 80, amber to 95, red at 95 and up.
License=MIT
Version=0.1.0

[Variables]
; The accounts to merge, in stack order. The unrolled blocks in
; @Resources/DenseRows.inc are keyed on these, so adding a fourth account
; means generating a fourth block there, not just a line here.
A1=opencode
A2=claude
A3=claude-a

@Include=#@#Dense.inc
@Include2=#@#DenseRows.inc
